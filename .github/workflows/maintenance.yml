name: Maintenance build
on:
  push:
    branches: [maintenance]
    tags: ['maintenance-*']
  pull_request:
    branches: [maintenance]
  workflow_dispatch:
    inputs:
      operation:
        description: Validate source or verify a published image
        type: choice
        options: [validate, verify-image]
        default: validate
      image_tag:
        description: Existing image tag to verify
        type: string
        default: maintenance-v0.13.1-security.20260921.1
permissions:
  contents: read
concurrency:
  group: maintenance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: ${{ !startsWith(github.ref, 'refs/tags/maintenance-') && inputs.operation != 'verify-image' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Make room for the upstream runtime image
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker image prune -af
      - name: Build and run all CI checks
        run: ./maintenance/build.sh "$RUNNER_TEMP/jobops-build"
      - name: Check the production runtime
        run: ./maintenance/runtime-check.sh
  release:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/maintenance-') && github.repository == 'brooksandrew0/job-ops' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Make room for the upstream runtime image
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker image prune -af
      - name: Build and run all CI checks
        run: ./maintenance/build.sh "$RUNNER_TEMP/jobops-build"
      - name: Check the production runtime
        run: ./maintenance/runtime-check.sh
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested version and commit tags
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          image=ghcr.io/brooksandrew0/job-ops
          [[ "$RELEASE_TAG" =~ ^maintenance-[A-Za-z0-9_.-]+$ ]]
          docker tag jobops-maintenance:local "$image:$RELEASE_TAG"
          docker tag jobops-maintenance:local "$image:sha-$SOURCE_COMMIT"
          docker push "$image:$RELEASE_TAG"
          docker push "$image:sha-$SOURCE_COMMIT"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image:$RELEASE_TAG")
          printf 'Published tested image: `%s`\n\nSource: `%s`\n\nDeployment requires separate approval and infrastructure documentation.\n' "$digest" "$SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
  verify-image:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'verify-image' && github.repository == 'brooksandrew0/job-ops' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Verify private package visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          visibility=$(gh api users/brooksandrew0/packages/container/job-ops --jq .visibility)
          test "$visibility" = private
          printf 'Verified package visibility: %s\n' "$visibility" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the published manifest
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG" =~ ^maintenance-[A-Za-z0-9_.-]+$ ]]
          docker buildx imagetools inspect "ghcr.io/brooksandrew0/job-ops:$IMAGE_TAG" | tee -a "$GITHUB_STEP_SUMMARY"
