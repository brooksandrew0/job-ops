name: Maintenance build
on:
  push:
    branches: [maintenance]
  pull_request:
    branches: [maintenance]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maintenance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Make room for the upstream runtime image
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker image prune -af
      - name: Build and run all CI checks
        run: ./maintenance/build.sh "$RUNNER_TEMP/jobops-build"
      - name: Check the production runtime
        run: ./maintenance/runtime-check.sh
